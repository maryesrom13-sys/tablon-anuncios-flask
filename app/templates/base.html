<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tablón de Anuncios</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <!-- Cabecera Institucional Sencilla -->
    <div class="bg-light py-3 border-bottom text-center">
        <h2>Tablon de Anuncios </h2>
    </div>

    <!-- Menú de Navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">Inicio</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="#"></a>
                <a class="nav-link" href="#"></a>
                <a class="nav-link" href="#"></a>
                
                
                <a class="nav-link btn btn-outline-light btn-sm ms-2 text-dark bg-white" href="{{ url_for('main.login') }}">Iniciar Sesión</a>
                <a class="nav-link btn btn-outline-light btn-sm ms-2 text-dark bg-white" href="{{ url_for('main.registros') }}">Registrarse</a>
                <a class="nav-link" href="{{ url_for('main.categorias') }}">Categorías</a>
                <a class="nav-link" href="{{ url_for('main.anuncios') }}">Anuncios</a>
            </div>
        </div>
    </nav>

    <!-- Área de Contenido Principal -->
    <div class="container">
        {% block content %}
        <div class="alert alert-info">
            <h4>¡Bienvenido!</h4>
            <p class="mb-0">Para administrar usa el menu..!!!</p>
        </div>
        {% endblock %}
    </div>

    <!-- Pie de página sencillo -->
    <footer class="text-center text-muted py-4 mt-5 border-top">
        <p class="mb-0">Esther Mamani- Tecnologia emergentes II</p>
    </footer>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
